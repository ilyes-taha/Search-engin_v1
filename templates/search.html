<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alita — Moteur de Recherche</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&family=Courier+Prime&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
</head>
<body>
    <div class="grid-overlay"></div>
    <div class="noise"></div>

    <main class="hero">
        <header class="brand">
            <div class="brand__symbol">◈</div>
            <h1 class="brand__name">Alita</h1>
            <p class="brand__tagline">Intelligence documentaire</p>
        </header>

        <section class="search-zone">
            {% if empty_corpus %}
            <div class="empty-corpus-notice">
                <span class="empty-corpus-notice__icon">⚠</span>
                <p>Aucun document trouvé dans le répertoire <code>corpus/</code>.<br>
                Ajoutez des fichiers <strong>.txt</strong> ou <strong>.pdf</strong> dans ce dossier, puis relancez l'application.</p>
            </div>
            {% endif %}
            <form action="/" method="post" class="search-form" id="searchForm">
                <div class="input-wrap">
                    <input
                        type="text"
                        id="q"
                        name="q"
                        placeholder="Recherchez dans vos documents…"
                        autocomplete="off"
                        onkeyup="fetchSuggestions()"
                        {% if empty_corpus %}disabled{% endif %}
                    >
                    <button type="submit" class="btn-search" {% if empty_corpus %}disabled{% endif %}>
                        <span>Chercher</span>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                        </svg>
                    </button>
                </div>
                <div id="suggestions" class="suggestions"></div>
            </form>
        </section>

        <footer class="hero-footer">
            <span class="mono">v2.0</span>
            <span class="sep">·</span>
            <span class="mono">TF-IDF Engine</span>
            <span class="sep">·</span>
            <span class="mono">NLP FR</span>
        </footer>
    </main>

    <script>
        async function fetchSuggestions() {
            const q = document.getElementById('q').value.trim();
            const box = document.getElementById('suggestions');
            if (q.length < 2) { box.innerHTML = ''; return; }

            try {
                const res = await fetch(`/suggest?q=${encodeURIComponent(q)}`);
                const data = await res.json();
                if (!data.length) { box.innerHTML = ''; return; }
                box.innerHTML = data.map(w =>
                    `<div class="sug-item" onclick="pick('${w.replace(/'/g,"\\'")}')">
                        <span class="sug-icon">↗</span> ${w}
                    </div>`
                ).join('');
            } catch(e) { box.innerHTML = ''; }
        }

        function pick(word) {
            document.getElementById('q').value = word;
            document.getElementById('suggestions').innerHTML = '';
        }

        document.addEventListener('click', e => {
            if (!e.target.closest('.input-wrap')) {
                document.getElementById('suggestions').innerHTML = '';
            }
        });
    </script>
</body>
</html>
